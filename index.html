  <title>AppForge: Vibe Code with Sovereign Safety</title>
  <style>
    #root-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #root-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(99, 102, 241, 0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 14px;
      opacity: 0.8;
    }
    .noscript-message {
      text-align: center;
      padding: 40px 20px;
      max-width: 500px;
    }
    .noscript-message h1 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #6366f1;
    }
    .noscript-message p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="root-loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading AppForge...</div>
    </div>
  </div>
  <noscript>
    <div id="root-loading">
      <div class="noscript-message">
        <h1>⚡ JavaScript Required</h1>
        <p>AppForge requires JavaScript to run. Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
