# Development Docker Compose
# For local development with hot reload

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: appforge-backend-dev
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/appforge
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key-not-for-production
      - ENCRYPTION_KEY=12345678901234567890123456789012
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - appforge-dev
    command: npm run dev

  mongodb:
    image: mongo:7
    container_name: appforge-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb-dev-data:/data/db
    networks:
      - appforge-dev

  redis:
    image: redis:7-alpine
    container_name: appforge-redis-dev
    ports:
      - "6379:6379"
    networks:
      - appforge-dev

networks:
  appforge-dev:
    driver: bridge

volumes:
  mongodb-dev-data:
