[package]
name = "static-analyzer-core"
version = "0.1.0"
edition = "2021"
authors = ["AppForge Contributors"]
description = "Static analysis core for AppForge (WASM)"
license = "Apache-2.0"
repository = "https://github.com/fernandogarzaaa/appforge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = true
