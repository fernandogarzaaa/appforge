<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Quantum License | AppForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glow {
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
        }

        .btn-grad {
            background-image: linear-gradient(to right, #4776E6 0%, #8E54E9 51%, #4776E6 100%);
            background-size: 200% auto;
            transition: 0.5s;
        }

        .btn-grad:hover {
            background-position: right center;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass p-8 rounded-2xl max-w-md w-full glow text-center">
        <div class="mb-6">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-600">
                Quantum Engine
            </h1>
            <p class="text-gray-400 text-sm tracking-widest uppercase mt-2">Direct Enterprise Uplink</p>
        </div>

        <div class="space-y-4 mb-8 text-left">
            <div class="flex justify-between border-b border-gray-700 pb-2">
                <span class="text-gray-400">Product</span>
                <span class="font-mono">Universal Dist v1.0</span>
            </div>
            <div class="flex justify-between border-b border-gray-700 pb-2">
                <span class="text-gray-400">Network</span>
                <span class="font-mono text-cyan-400">Solana (Native)</span>
            </div>
            <div class="flex justify-between border-b border-gray-700 pb-2">
                <span class="text-gray-400">Price</span>
                <span class="font-mono text-xl font-bold text-green-400">$80,000 USDC</span>
            </div>
        </div>

        <div id="status" class="hidden mb-4 p-3 rounded bg-blue-900/50 text-blue-200 text-xs"></div>

        <!-- Action Button -->
        <button id="connectBtn" onclick="connectWallet()"
            class="block w-full py-4 px-6 btn-grad rounded-lg font-bold text-lg text-white shadow-lg mb-4">
            Connect Phantom 👻
        </button>

        <button id="payBtn" onclick="payNow()"
            class="hidden block w-full py-4 px-6 bg-green-600 hover:bg-green-500 rounded-lg font-bold text-lg text-white shadow-lg">
            Transfer $80k USDC 💸
        </button>

        <p class="mt-6 text-xs text-gray-500">
            0% Fees. Direct On-Chain Settlement.<br>
            Requires Phantom Wallet installed.
        </p>

        <div class="mt-8 pt-4 border-t border-gray-700 text-xs text-gray-400">
            <a href="privacy.html" target="_blank" class="hover:text-white mr-4">Privacy Policy</a>
            <a href="terms.html" target="_blank" class="hover:text-white">Terms of Service</a>
        </div>
    </div>

    <script>
        // CONFIG
        const TREASURY = "2ZeBAFtHq5vNThXMjbZ7E59Msgv6xPpBFn7cw4KMxmot";
        const AMOUNT_USDC = 80000;
        const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"; // Mainnet USDC

        // GLOBALS
        let provider = null;
        let connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");

        function log(msg, type = 'info') {
            const el = document.getElementById('status');
            el.innerHTML = msg;
            el.className = `mb-4 p-3 rounded text-xs ${type === 'error' ? 'bg-red-900/50 text-red-200' : 'bg-blue-900/50 text-blue-200'}`;
            el.classList.remove('hidden');
        }

        async function connectWallet() {
            if ("solana" in window) {
                provider = window.solana;
                try {
                    const resp = await provider.connect();
                    log(`✅ Connected: ${resp.publicKey.toString()}`);
                    document.getElementById('connectBtn').classList.add('hidden');
                    document.getElementById('payBtn').classList.remove('hidden');
                } catch (err) {
                    log("❌ Connection rejected", "error");
                }
            } else {
                window.open("https://phantom.app/", "_blank");
                log("⚠️ Please install Phantom Wallet", "error");
            }
        }

        async function payNow() {
            if (!provider) return;
            log("⏳ Constructing Transaction...");

            try {
                const buyer = provider.publicKey;
                const mint = new solanaWeb3.PublicKey(USDC_MINT);
                const treasury = new solanaWeb3.PublicKey(TREASURY);

                // 1. Get Token Accounts
                // Note: Simplified for web. In a real app we'd use getAssociatedTokenAddress
                // For this demo, we assume user has USDC account. 
                // A robust implementation would perform a full build using @solana/spl-token

                // Fallback to simple SOL transfer for demo if USDC fails implies complexity
                // But for $80k, we MUST use USDC.

                log("⚠️ Initiating Direct Transfer... check your wallet.");

                // Construct a text-based memo/transfer for the wallet to sign
                // Since browser-side transaction construction without a bundler is tricky,
                // We will use the simplest "Sign Message" to verify intent, 
                // OR ideally, use the standard SPL Token transfer instruction if imports work.

                // For this static HTML, we can't easily import the full SPL library without build steps.
                // STRATEGY: Create a "Solana Pay" URL link which Phantom handles natively.

                const label = "Quantum Engine License";
                const message = "Monthly Enterprise Subscription";
                const memo = "ENT-80K";

                // Solana Pay URL Spec
                // solana:<recipient>?amount=<amount>&spl-token=<mint>&label=<label>&message=<message>
                const solanaPayUrl = `solana:${TREASURY}?amount=${AMOUNT_USDC}&spl-token=${USDC_MINT}&label=${encodeURIComponent(label)}&message=${encodeURIComponent(message)}`;

                // Attempt to open standard handler
                window.location.href = solanaPayUrl;

                log("🚀 Wallet should prompt for transfer!");

            } catch (err) {
                console.error(err);
                log(`❌ Error: ${err.message}`, "error");
            }
        }
    </script>
</body>

</html>
