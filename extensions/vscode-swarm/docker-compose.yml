version: '3.8'

services:
  # Main Swarm API
  swarm-api:
    build:
      context: ../../..
      dockerfile: swarm/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - swarm-data:/app/data
      - ../../..:/app:ro
    depends_on:
      - ollama
    networks:
      - swarm-net

  # Local Ollama for offline mode
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - swarm-net

  # LlamaCpp (alternative local inference)
  llamacpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    environment:
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - swarm-net

volumes:
  swarm-data:
  ollama-data:

networks:
  swarm-net:
    driver: bridge
