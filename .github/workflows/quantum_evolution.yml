name: Quantum Self-Evolution

on:
  schedule:
    - cron: "0 */4 * * *" # Run every 4 hours (was every hour)
  workflow_dispatch: # Manual trigger

concurrency:
  group: quantum-self-evolution
  cancel-in-progress: false

jobs:
  quantum-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            swarm/package-lock.json

      - name: Cache Evolution State
        uses: actions/cache@v4
        with:
          path: |
            src/data/quantum_state.json
            src/data/quantum_predictions.json
            src/data/quantum_weights.json
            src/data/bounty_ledger.json
            src/data/economic_state.json
            src/data/synergy_scout.json
            src/data/antigravity_blueprint.json
          key: quantum-evolution-${{ github.run_number }}
          restore-keys: |
            quantum-evolution-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true

      - name: Build Quantum Bridge
        run: |
          if [ -f swarm/core/quantum_bridge/Cargo.toml ]; then
            cd swarm/core/quantum_bridge
            cargo generate-lockfile 2>/dev/null || true
            cargo build --release || echo "::warning::Quantum bridge build failed"
          else
            echo "::notice::Quantum bridge not found, skipping"
          fi
        continue-on-error: true

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          if [ -f swarm/package-lock.json ]; then
            cd swarm && npm ci --legacy-peer-deps
          fi

      - name: Validate AI Provider Secrets
        id: ai-secrets
        run: |
          has_openai="${{ secrets.OPENAI_API_KEY != '' }}"
          has_gemini="${{ secrets.GEMINI_API_KEY != '' }}"
          if [ "$has_openai" = "true" ] || [ "$has_gemini" = "true" ]; then
            echo "has_provider=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_provider=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No AI provider keys configured. Skipping AI-dependent steps."
          fi

      - name: Run Resonance Check
        run: |
          if [ -f scripts/resonance_check.ts ]; then
            npx tsx scripts/resonance_check.ts
          fi
        env:
          TRUE_AI_INDEPENDENCE: "true"
        continue-on-error: true

      - name: Run Reality Pulse
        run: |
          if [ -f scripts/reality_pulse.ts ]; then
            npx tsx scripts/reality_pulse.ts
          fi
        env:
          TRUE_AI_INDEPENDENCE: "true"
          NODE_ID: "GH-ACTIONS-EVO"
          MESH_ENABLED: "true"
        continue-on-error: true

      - name: Pre-Pulse Diagnostics
        run: |
          npm run build > build_logs.txt 2>&1 || echo "Build completed with warnings" > build_logs.txt
          npm run lint -- --format json > lint_output.json 2>&1 || echo "[]" > lint_output.json
        continue-on-error: true

      - name: Configure Git Identity
        run: |
          git config --global user.email "fernando@appforge.ai"
          git config --global user.name "Fernando Garza (Sovereign Swarm)"

      - name: Run Quantum Evolution
        if: steps.ai-secrets.outputs.has_provider == 'true'
        working-directory: ./swarm
        run: |
          if [ -f intelligence_pulse.ts ]; then
            npx tsx intelligence_pulse.ts
          else
            echo "::warning::intelligence_pulse.ts not found"
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRUE_AI_INDEPENDENCE: "true"
          NODE_ID: "GA-EVOLUTION"
          MESH_ENABLED: "true"
          RESONANCE_PORT: "11435"
          QUANTUM_GENERATIONS: "50"
          QUANTUM_EPOCHS: "100"
        continue-on-error: true

      - name: Run Synergy Scouting
        if: steps.ai-secrets.outputs.has_provider == 'true'
        run: npm run swarm:scout || echo "::warning::Scout failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Architectural Analysis
        run: npm run swarm:analyze || echo "::warning::Analysis failed"
        continue-on-error: true

      - name: Run Singularity Verification
        run: |
          if [ -f scripts/verify_evolution.ts ]; then
            npx tsx scripts/verify_evolution.ts
          fi
        env:
          TRUE_AI_INDEPENDENCE: "true"
        continue-on-error: true

      - name: Upload Evolution Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-evolution-${{ github.run_number }}
          path: |
            src/data/quantum_state.json
            src/data/quantum_predictions.json
            build_logs.txt
            lint_output.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit Evolution Results
        run: |
          git config --global user.name "Quantum Engine"
          git config --global user.email "quantum@appforge.bot"
          git add -f src/data/*.json 2>/dev/null || true
          git add -f build_logs.txt lint_output.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: quantum self-evolution [Inception] [Bounty Sync] [Synergy] [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          for attempt in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed. Rebasing and retrying..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo "::warning::Failed to push after 3 attempts"
