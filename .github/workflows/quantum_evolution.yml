name: Quantum Self-Evolution

on:
  schedule:
    - cron: "0 * * * *" # Run every hour on the hour
  workflow_dispatch: # Manual trigger

concurrency:
  group: quantum-self-evolution
  cancel-in-progress: false

jobs:
  quantum-evolution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Full history for rebasing

      - name: Setup Node.js (v22 Required)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⚡ CACHE: Node.js dependencies
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-root-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-root-

      # 📦 CACHE: Quantum evolution state
      - name: Cache Evolution State
        uses: actions/cache@v4
        with:
          path: |
            src/data/quantum_state.json
            src/data/quantum_predictions.json
            src/data/quantum_weights.json
            src/data/bounty_ledger.json
            src/data/economic_state.json
            src/data/synergy_scout.json
            src/data/antigravity_blueprint.json
          key: quantum-evolution-${{ github.run_number }}
          restore-keys: |
            quantum-evolution-

      - name: Setup Rust (Latest)
        uses: dtolnay/rust-toolchain@stable

      - name: Build Quantum Bridge
        working-directory: ./swarm/core/quantum_bridge
        run: cargo build --release

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          cd swarm && npm ci --legacy-peer-deps

      - name: Run Resonance Check
        run: npx tsx scripts/resonance_check.ts
        env:
          TRUE_AI_INDEPENDENCE: "true"

      - name: Run Reality Pulse 2.0
        working-directory: ./
        run: npx tsx scripts/reality_pulse.ts
        env:
          TRUE_AI_INDEPENDENCE: "true"
          NODE_ID: "GH-ACTIONS-EVO"
          MESH_ENABLED: "true"

      # 🔍 DIAGNOSTICS: Generate reality signals for Inception
      - name: Pre-Pulse Diagnostics
        run: |
          npm ci --legacy-peer-deps
          npm run build > build_logs.txt 2>&1 || echo "Build failed (as expected for diagnosis)" > build_logs.txt
          npm run lint -- --format json > lint_output.json 2>&1 || echo "[]" > lint_output.json
        continue-on-error: true

      - name: Configure Git Identity
        run: |
          git config --global user.email "fernando@appforge.ai"
          git config --global user.name "Fernando Garza (Sovereign Swarm)"

      - name: Run Quantum Evolution
        working-directory: ./swarm
        run: npx tsx intelligence_pulse.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRUE_AI_INDEPENDENCE: "true"
          QCORE_PATH: "./core/quantum_bridge/target/release/quantum_bridge"
          NODE_ID: "GA-EVOLUTION"
          MESH_ENABLED: "true"
          RESONANCE_PORT: "11435"
          # 📡 GATEWAY: Multi-Transport Sovereign Bridge
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Optimization Parameters (Hourly Cycle)
          QUANTUM_GENERATIONS: "50"
          QUANTUM_EPOCHS: "100"

      - name: Run Synergy Scouting
        working-directory: ./
        run: npm run swarm:scout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Architectural Analysis
        working-directory: ./
        run: npm run swarm:analyze

      - name: Run Singularity Verification
        working-directory: ./
        run: npx tsx scripts/verify_evolution.ts
        env:
          TRUE_AI_INDEPENDENCE: "true"

      # 📡 Upload evolution artifacts
      - name: Upload Evolution Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-evolution-${{ github.run_number }}
          path: |
            src/data/quantum_state.json
            src/data/quantum_predictions.json
          retention-days: 30

      - name: Commit Evolution Results
        run: |
          git config --global user.name "Quantum Engine"
          git config --global user.email "quantum@appforge.bot"
          git add -f src/data/*.json
          git add -f src/**/*.ts
          git add -f apps/**/*.ts
          git add -f backend/**/*.ts
          git add -f swarm/**/*.ts
          git add -f docs/brain/*.md
          git add -f build_logs.txt || true
          git add -f lint_output.json || true
          git commit -m "chore: quantum self-evolution [Inception] [Bounty Sync] [Synergy] [skip ci]" || echo "No changes to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
