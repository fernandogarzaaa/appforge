name: Dependency Upgrade Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install tsx globally
        run: npm install --global tsx

      - name: Analyze repository state
        run: npx tsx scripts/ci_manager.ts REPORT

      - name: Run specialized agent task with bounded retry
        id: run_agent
        continue-on-error: true
        timeout-minutes: 14
        run: |
          mkdir -p agent_outputs
          LOG_FILE="agent_outputs/dependency_upgrade_agent_attempts.log"
          : > "$LOG_FILE"

          MAX_ATTEMPTS=2
          STEP_BUDGET_SECONDS=$((14 * 60))
          BACKOFF_SECONDS=20
          SAFETY_BUFFER_SECONDS=45
          PER_ATTEMPT_TIMEOUT_SECONDS=$(((STEP_BUDGET_SECONDS - (BACKOFF_SECONDS * (MAX_ATTEMPTS - 1)) - SAFETY_BUFFER_SECONDS) / MAX_ATTEMPTS))
          if [ "$PER_ATTEMPT_TIMEOUT_SECONDS" -lt 120 ]; then
            PER_ATTEMPT_TIMEOUT_SECONDS=120
          fi
          ATTEMPT=1
          SUCCESS=0
          LAST_FAILURE_MODE="none"

          echo "[dependency-upgrade-agent] budget step=${STEP_BUDGET_SECONDS}s per_attempt=${PER_ATTEMPT_TIMEOUT_SECONDS}s max_attempts=${MAX_ATTEMPTS}" | tee -a "$LOG_FILE"

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "[dependency-upgrade-agent] attempt $ATTEMPT/$MAX_ATTEMPTS" | tee -a "$LOG_FILE"
            set +e
            timeout --signal=TERM --kill-after=20s "${PER_ATTEMPT_TIMEOUT_SECONDS}s" npx tsx scripts/real_swarm_executor.ts "Dependency Upgrade Agent" 2>&1 | tee -a "$LOG_FILE"
            ATTEMPT_EXIT_CODE=${PIPESTATUS[0]}
            set -e

            if [ "$ATTEMPT_EXIT_CODE" -eq 0 ]; then
              SUCCESS=1
              break
            fi

            if [ "$ATTEMPT_EXIT_CODE" -eq 124 ]; then
              LAST_FAILURE_MODE="attempt_timeout"
              echo "[dependency-upgrade-agent] attempt $ATTEMPT timed out after ${PER_ATTEMPT_TIMEOUT_SECONDS}s" | tee -a "$LOG_FILE"
            else
              LAST_FAILURE_MODE="attempt_error_code_${ATTEMPT_EXIT_CODE}"
              echo "[dependency-upgrade-agent] attempt $ATTEMPT failed with exit code ${ATTEMPT_EXIT_CODE}" | tee -a "$LOG_FILE"
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "[dependency-upgrade-agent] attempt $ATTEMPT failed, retrying after backoff" | tee -a "$LOG_FILE"
              sleep "$BACKOFF_SECONDS"
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" -eq 1 ]; then
            echo "final_status=success" >> "$GITHUB_OUTPUT"
            echo "attempts_used=$ATTEMPT" >> "$GITHUB_OUTPUT"
            echo "failure_mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "final_status=failed" >> "$GITHUB_OUTPUT"
          echo "attempts_used=$MAX_ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "failure_mode=$LAST_FAILURE_MODE" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Classify dependency-agent outcome
        id: classify
        if: always()
        run: |
          STEP_OUTCOME="${{ steps.run_agent.outcome }}"
          FINAL_STATUS="${{ steps.run_agent.outputs.final_status || '' }}"
          ATTEMPTS="${{ steps.run_agent.outputs.attempts_used || '' }}"
          FAILURE_MODE="${{ steps.run_agent.outputs.failure_mode || '' }}"
          MAX_ATTEMPTS="2"

          if [ -z "$ATTEMPTS" ] && [ -f "agent_outputs/dependency_upgrade_agent_attempts.log" ]; then
            LAST_ATTEMPT_LINE=$(grep -Eo 'attempt [0-9]+/[0-9]+' agent_outputs/dependency_upgrade_agent_attempts.log | tail -n 1 || true)
            if [ -n "$LAST_ATTEMPT_LINE" ]; then
              ATTEMPTS=$(echo "$LAST_ATTEMPT_LINE" | sed -E 's/attempt ([0-9]+)\/.*/\1/')
              MAX_ATTEMPTS=$(echo "$LAST_ATTEMPT_LINE" | sed -E 's/attempt [0-9]+\/([0-9]+)/\1/')
            fi
          fi

          if [ -z "$ATTEMPTS" ]; then
            ATTEMPTS="0"
          fi

          if [ -z "$FINAL_STATUS" ]; then
            if [ "$STEP_OUTCOME" = "success" ]; then
              FINAL_STATUS="success"
            else
              FINAL_STATUS="failed"
            fi
          fi

          if [ "$STEP_OUTCOME" = "cancelled" ]; then
            CLASSIFICATION="cancelled"
          elif [ "$STEP_OUTCOME" = "failure" ] && [ "$FINAL_STATUS" = "failed" ]; then
            if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ] && [ "$MAX_ATTEMPTS" -gt 0 ]; then
              CLASSIFICATION="failed_after_all_retries"
            elif [ "$ATTEMPTS" -gt 0 ]; then
              CLASSIFICATION="interrupted_or_timeout_before_retry_completion"
            else
              CLASSIFICATION="failed_unknown_progress"
            fi
          elif [ "$STEP_OUTCOME" = "success" ] && [ "$ATTEMPTS" != "1" ]; then
            CLASSIFICATION="recovered_after_retry"
          elif [ "$STEP_OUTCOME" = "success" ]; then
            CLASSIFICATION="success"
          else
            CLASSIFICATION="unknown"
          fi

          echo "classification=$CLASSIFICATION" >> "$GITHUB_OUTPUT"
          echo "step_outcome=$STEP_OUTCOME" >> "$GITHUB_OUTPUT"
          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"
          echo "failure_mode=$FAILURE_MODE" >> "$GITHUB_OUTPUT"
          echo "attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "max_attempts=$MAX_ATTEMPTS" >> "$GITHUB_OUTPUT"

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Dependency Upgrade Agent"
            echo ""
            echo "- Step outcome: ${{ steps.classify.outputs.step_outcome }}"
            echo "- Final status: ${{ steps.classify.outputs.final_status }}"
            echo "- Classification: ${{ steps.classify.outputs.classification }}"
            echo "- Failure mode: ${{ steps.classify.outputs.failure_mode }}"
            echo "- Attempts used: ${{ steps.classify.outputs.attempts }} / ${{ steps.classify.outputs.max_attempts }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent_dependency_upgrade_agent_output.json
          path: |
            agent_outputs/**/*.json
            agent_outputs/dependency_upgrade_agent_attempts.log
          if-no-files-found: warn

      - name: Fail on unrecovered agent failure
        if: always() && contains('failed_after_all_retries interrupted_or_timeout_before_retry_completion failed_unknown_progress', steps.classify.outputs.classification)
        run: |
          echo "Dependency upgrade agent failed with classification: ${{ steps.classify.outputs.classification }}" >&2
          exit 1
