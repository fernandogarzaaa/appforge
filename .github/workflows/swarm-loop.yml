name: Swarm Loop

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: swarm-controller
  cancel-in-progress: false

jobs:
  controller:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_task: ${{ steps.context.outputs.has_task }}
      run_id: ${{ steps.context.outputs.run_id }}
      reason: ${{ steps.context.outputs.reason }}
      task_id: ${{ steps.context.outputs.task_id }}
      task_signal: ${{ steps.context.outputs.task_signal }}
      strategies: ${{ steps.context.outputs.strategies }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare swarm run context
        run: npx tsx scripts/swarm_controller.ts

      - name: Expose run context
        id: context
        run: |
          node scripts/extract_run_context.js >> "$GITHUB_OUTPUT"

      - name: Upload swarm state
        uses: actions/upload-artifact@v4
        with:
          name: swarm-state
          path: |
            swarm/run_context.json
            swarm/swarm_memory.json
            swarm/task_queue.json

  guard-controller:
    needs: controller
    if: needs.controller.outputs.has_task != 'true' && needs.controller.outputs.reason == 'empty_strategies'
    runs-on: ubuntu-latest
    steps:
      - name: Fail on empty strategy generation
        run: |
          echo "Controller selected task '${{ needs.controller.outputs.task_id }}' (signal='${{ needs.controller.outputs.task_signal }}') but produced zero strategies."
          echo "Failing workflow to avoid misleading success-with-skips."
          exit 1

  experiments:
    needs: controller
    if: needs.controller.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        strategy: ${{ fromJson(needs.controller.outputs.strategies) }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download swarm state
        uses: actions/download-artifact@v4
        with:
          name: swarm-state
          path: swarm

      - name: Configure git for experiment branch
        run: |
          git config user.name "appforge-swarm-bot"
          git config user.email "swarm-bot@appforge.local"

      - name: Run experiment strategy
        id: run_experiment
        env:
          SWARM_STRATEGY_ID: ${{ matrix.strategy }}
        run: npx tsx scripts/swarm_parallel_experiment.ts
        continue-on-error: true

      - name: Ensure fallback experiment result on strategy crash
        if: steps.run_experiment.outcome != 'success'
        env:
          SWARM_STRATEGY_ID: ${{ matrix.strategy }}
        run: |
          mkdir -p swarm/experiment_results
          node -e "
            const fs = require('fs');
            const path = require('path');
            const strategyId = process.env.SWARM_STRATEGY_ID || 'unknown';
            const resultPath = path.join('swarm', 'experiment_results', `${strategyId}.json`);
            if (!fs.existsSync(resultPath)) {
              const payload = {
                run_id: process.env.GITHUB_RUN_ID || `${Date.now()}`,
                strategy_id: strategyId,
                success: false,
                benchmark_score: 0,
                checks: {
                  execution: false,
                  lint_fix: false,
                  typecheck: false,
                  lint: false,
                  tests: false,
                  benchmark: false,
                  build: false
                }
              };
              fs.writeFileSync(resultPath, JSON.stringify(payload, null, 2));
            }
          "

      - name: Upload experiment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ matrix.strategy }}
          path: swarm/experiment_results/${{ matrix.strategy }}.json
          if-no-files-found: warn

  select-result:
    needs: [controller, experiments]
    if: always() && needs.controller.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download swarm state
        uses: actions/download-artifact@v4
        with:
          name: swarm-state
          path: swarm

      - name: Download experiment results
        uses: actions/download-artifact@v4
        with:
          pattern: experiment-*
          path: swarm/experiment_results
          merge-multiple: true
        continue-on-error: true

      - name: Configure git for merge
        run: |
          git config user.name "appforge-swarm-bot"
          git config user.email "swarm-bot@appforge.local"

      - name: Select winner and merge
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Selection attempt ${attempt}/${max_attempts}"
            if npx tsx scripts/swarm_result_selector.ts swarm/experiment_results; then
              echo "Selection and merge completed."
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Selection failed after ${max_attempts} attempts."
              exit 1
            fi

            echo "Retrying after syncing with origin/main..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            attempt=$((attempt + 1))
            sleep 5
          done
