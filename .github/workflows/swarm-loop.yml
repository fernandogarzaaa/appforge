name: Swarm Loop

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: swarm-controller
  cancel-in-progress: false

jobs:
  controller:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_task: ${{ steps.context.outputs.has_task }}
      run_id: ${{ steps.context.outputs.run_id }}
      strategies: ${{ steps.context.outputs.strategies }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare swarm run context
        run: npx tsx scripts/swarm_controller.ts

          if [ -f ./swarm/run_context.json ]; then
            strategies=$(node -e "const fs = require('fs'); const p = './swarm/run_context.json'; const ctx = JSON.parse(fs.readFileSync(p, 'utf8')); const list = Array.isArray(ctx.strategies) ? ctx.strategies.map(s => s.id) : []; console.log(JSON.stringify(list));")
          else
            strategies="[]"
          fi
        id: context
        run: |
          node scripts/extract_run_context.js >> "$GITHUB_OUTPUT"

      - name: Upload swarm state
        uses: actions/upload-artifact@v4
        with:
          name: swarm-state
          path: |
            swarm/run_context.json
            swarm/swarm_memory.json
            swarm/task_queue.json

  experiments:
    needs: controller
    if: needs.controller.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        strategy: ${{ fromJson(needs.controller.outputs.strategies) }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          path: .
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download swarm state
        uses: actions/download-artifact@v4
        with:
          name: swarm-state
          path: .

      - name: Configure git for experiment branch
        run: |
          git config user.name "appforge-swarm-bot"
          git config user.email "swarm-bot@appforge.local"

      - name: Run experiment strategy
        env:
          SWARM_STRATEGY_ID: ${{ matrix.strategy }}
        run: npx tsx scripts/swarm_parallel_experiment.ts

      - name: Upload experiment result
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ matrix.strategy }}
          path: swarm/experiment_results/${{ matrix.strategy }}.json

  select-result:
    needs: [controller, experiments]
    if: needs.controller.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download swarm state
        uses: actions/download-artifact@v4
        with:
          name: swarm-state
          path: .

      - name: Download experiment results
        uses: actions/download-artifact@v4
        with:
          pattern: experiment-*
          path: swarm/experiment_results
          merge-multiple: true
        continue-on-error: true

      - name: Configure git for merge
        run: |
          git config user.name "appforge-swarm-bot"
          git config user.email "swarm-bot@appforge.local"

      - name: Select winner and merge
        run: npx tsx scripts/swarm_result_selector.ts swarm/experiment_results
