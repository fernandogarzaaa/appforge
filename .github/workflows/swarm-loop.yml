name: Swarm Loop

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: swarm-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            swarm/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          if [ -f swarm/package-lock.json ]; then
            cd swarm && npm ci --legacy-peer-deps
          fi

      - name: Run swarm controller
        run: npx tsx scripts/swarm_controller.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUE_AI_INDEPENDENCE: 'true'
