# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "quantum-core\nstatic-analyzer-core"
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      # Typecheck temporarily disabled due to existing TS errors in repo
      # - name: Typecheck
      #   run: npm run typecheck
      - name: Run unit tests
        run: npm run test
      - run: npm run build:quantum
        continue-on-error: true
      - run: npm run build:analyzer
        continue-on-error: true
      - run: npm run build --if-present
    # Tests have mock/setup issues to be resolved separately
    # - run: npm test
