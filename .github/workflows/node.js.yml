name: Node.js CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "SWARM_STATUS.md"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            swarm/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install tsx globally
        run: npm install --global tsx

      - name: Swagger import smoke check
        run: |
          API_FILE_COUNT=$(find src/api/routes src/api/endpoints -type f \( -name "*.js" -o -name "*.ts" \) 2>/dev/null | wc -l | tr -d ' ')
          export API_FILE_COUNT
          echo "swagger-api-files ${API_FILE_COUNT}"
          npx tsx -e "import('./src/api/swagger.config.ts').then((m)=>{const pathCount=Object.keys(m.swaggerSpec?.paths||{}).length; const apiFileCount=Number(process.env.API_FILE_COUNT||'0'); console.log('swagger-paths', pathCount); if(apiFileCount>0 && pathCount===0){console.error('Swagger spec contains zero paths despite API source files.'); process.exit(1);} }).catch((e)=>{console.error(e); process.exit(1);})"

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: npm run build --if-present

      - name: Report Telemetry
        if: always()
        run: npx tsx scripts/ci_manager.ts REPORT
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          CONCLUSION: ${{ job.status }}
