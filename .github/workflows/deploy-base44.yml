name: Deploy to Base44

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  deploy-base44:
    name: Deploy to Base44
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for production
        run: npm run build
        env:
          CI: true
      
      - name: Install Base44 CLI
        run: npm install -g base44
      
      - name: Deploy to Base44
        run: |
          # Authenticate with Base44
          export BASE44_API_KEY="${{ secrets.BASE44_API_KEY }}"
          
          # Check if project needs linking (first-time setup)
          echo "📦 Deploying appforge to Base44..."
          echo "Functions: $(ls -1 functions/*.ts | wc -l) TypeScript functions"
          echo "Site: React app (dist/)"
          
          # Deploy the project (entities, functions, and site files)
          # Note: First deployment may require manual 'base44 link' setup
          base44 deploy --verbose || {
            echo "⚠️  Deployment failed. If this is the first deployment:"
            echo "   1. Run 'base44 link' locally to connect project"
            echo "   2. Ensure BASE44_API_KEY has proper permissions"
            echo "   3. Check that .app.jsonc configuration is correct"
            exit 1
          }
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
        timeout-minutes: 5
      
      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Successfully deployed to Base44!"
          echo "Project deployed with entities, functions, and site files"
      
      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment to Base44 failed"
          echo "Check logs above for details"
          echo "Verify BASE44_API_KEY is set correctly in GitHub Secrets"
