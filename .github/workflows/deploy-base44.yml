name: Deploy to Base44

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  deploy-base44:
    name: Deploy to Base44
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for production
        run: npm run build
        env:
          CI: true
      
      - name: Install Base44 CLI
        run: npm install -g base44
      
      - name: Deploy to Base44
        run: |
          # Authenticate with Base44
          export BASE44_API_KEY="${{ secrets.BASE44_API_KEY }}"
          
          # Deploy the project (entities, functions, and site files)
          base44 deploy
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
      
      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Successfully deployed to Base44!"
          echo "Project deployed with entities, functions, and site files"
      
      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment to Base44 failed"
          echo "Check logs above for details"
          echo "Verify BASE44_API_KEY is set correctly in GitHub Secrets"
