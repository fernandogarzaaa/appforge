name: Autonomous Swarm Cycle

on:
  schedule:
    - cron: "0 4 * * *"  # Run daily at 4 AM instead of every 6 hours
  workflow_dispatch:

concurrency:
  group: autonomous-swarm-cycle
  cancel-in-progress: false

jobs:
  swarm-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Ensure swarm memory file exists
        run: |
          mkdir -p swarm
          if [ ! -f swarm/swarm_memory.json ]; then
            echo '{}' > swarm/swarm_memory.json
            echo "::notice::Created missing swarm/swarm_memory.json"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            swarm/package-lock.json

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            swarm/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'swarm/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          if [ -f swarm/package-lock.json ]; then
            cd swarm && npm ci --legacy-peer-deps
          fi

      - name: Install tsx globally
        run: npm install --global tsx

      - name: Run Resonance Check
        run: |
          if [ -f scripts/resonance_check.ts ]; then
            npx tsx scripts/resonance_check.ts
          else
            echo "::notice::resonance_check.ts not found, skipping"
          fi
        env:
          TRUE_AI_INDEPENDENCE: "true"
        continue-on-error: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true

      - name: Build Quantum Bridge
        run: |
          if [ -f swarm/core/quantum_bridge/Cargo.toml ]; then
            cargo build --release --manifest-path swarm/core/quantum_bridge/Cargo.toml
          else
            echo "::notice::Quantum bridge not found, skipping"
          fi
        continue-on-error: true

      - name: Run Reality Pulse
        run: |
          if [ -f scripts/reality_pulse.ts ]; then
            npx tsx scripts/reality_pulse.ts
          else
            echo "::notice::reality_pulse.ts not found, skipping"
          fi
        env:
          TRUE_AI_INDEPENDENCE: "true"
        continue-on-error: true

      - name: Pre-Pulse Diagnostics
        run: |
          npm run build > build_logs.txt 2>&1 || echo "Build completed with warnings" > build_logs.txt
          npm run lint -- --format json > lint_output.json 2>&1 || echo "[]" > lint_output.json
        continue-on-error: true

      - name: Configure Git Identity
        run: |
          git config --global user.email "fernando@appforge.ai"
          git config --global user.name "Fernando Garza (Sovereign Swarm)"

      - name: Validate Swarm runtime secrets
        id: swarm-secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
        run: |
          if [ -z "$BASE44_API_KEY" ] || [ -z "$BASE44_APP_ID" ]; then
            echo "::warning::Missing BASE44 secrets. Skipping swarm run."
            echo "can_run_swarm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$GEMINI_API_KEY" ] || [ -n "$XAI_API_KEY" ]; then
            echo "At least one AI provider key is configured"
            echo "can_run_swarm=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No AI provider key configured. Skipping swarm run."
            echo "can_run_swarm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Autonomous CI Healer
        if: steps.swarm-secrets.outputs.can_run_swarm == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TRUE_AI_INDEPENDENCE: "true"
        run: |
          if [ -f scripts/autonomous_ci_healer.ts ]; then
            npx tsx scripts/autonomous_ci_healer.ts
          else
            echo "::notice::CI healer script not found"
          fi
        continue-on-error: true

      - name: Run Swarm (One-Shot)
        id: swarm-run
        if: steps.swarm-secrets.outputs.can_run_swarm == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          ONE_SHOT: "true"
          TRUE_AI_INDEPENDENCE: "true"
        run: |
          if [ -d swarm ] && [ -f swarm/package.json ]; then
            cd swarm
            set +e
            timeout 20m env NODE_ID="GA-AUTONOMOUS" MESH_ENABLED="true" npm start
            swarm_exit_code=$?
            if [ "$swarm_exit_code" -eq 124 ]; then
              echo "::warning::Swarm runtime hit 20 minute timeout"
            fi
            echo "swarm_exit_code=$swarm_exit_code" >> "$GITHUB_OUTPUT"
            if [ "$swarm_exit_code" -ne 0 ]; then
              echo "::warning::Swarm exited with code $swarm_exit_code"
            fi
          else
            echo "::warning::Swarm directory not found"
            echo "swarm_exit_code=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Skip Swarm (One-Shot)
        if: steps.swarm-secrets.outputs.can_run_swarm != 'true'
        run: echo "::warning::Swarm skipped — required secrets not configured."

      - name: Run Singularity Verification
        run: |
          if [ -f scripts/verify_evolution.ts ]; then
            npx tsx scripts/verify_evolution.ts
          fi
        env:
          TRUE_AI_INDEPENDENCE: "true"
        continue-on-error: true

      - name: Benchmark Swarm Intelligence
        run: npm run swarm:benchmark || echo "::warning::Benchmark script not available"
        env:
          TRUE_AI_INDEPENDENCE: "true"
        continue-on-error: true

      - name: Run Tests
        run: npm run test

      - name: Commit updated swarm memory
        run: |
          if ! git diff --quiet -- swarm/swarm_memory.json; then
            git add swarm/swarm_memory.json
            git commit -m "chore: persist swarm memory state"
            git push origin HEAD:${{ github.ref_name }}
            echo "::notice::Persisted swarm/swarm_memory.json updates"
          else
            echo "::notice::No swarm memory changes detected"
          fi

      - name: Upload Swarm Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-evolution-${{ github.run_number }}
          path: |
            swarm/swarm_memory.json
            src/data/quantum_state.json
            src/data/quantum_predictions.json
            build_logs.txt
            lint_output.json
          retention-days: 14
          if-no-files-found: warn

      - name: Open Evolution Pull Request
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f scripts/create_evolution_pr.ts ]; then
            npx tsx scripts/create_evolution_pr.ts
          else
            echo "::notice::create_evolution_pr.ts not found, skipping PR creation"
          fi
        continue-on-error: true
