name: Autonomous Swarm Cycle

on:
  schedule:
    - cron: "*/15 * * * *" # Run every 15 minutes
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: autonomous-swarm-cycle
  cancel-in-progress: false

jobs:
  swarm-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Full history for rebasing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 🦀 TRANSCENDENCE: Rust Toolchain for Quantum Bridge
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # ⚡ CACHE: Node.js dependencies
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            swarm/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('swarm/package-lock.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 🦀 CACHE: Rust build artifacts
      - name: Cache Rust Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            swarm/core/quantum_bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('swarm/core/quantum_bridge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 📦 CACHE: Swarm Memory (evolution state persistence)
      - name: Cache Swarm Memory
        uses: actions/cache@v4
        with:
          path: |
            swarm/swarm_memory.json
            src/data/quantum_state.json
            src/data/quantum_predictions.json
            swarm_one_shot.log
            src/data/bounty_ledger.json
            src/data/economic_state.json
            src/data/synergy_scout.json
            src/data/antigravity_blueprint.json
          key: swarm-memory-${{ github.run_number }}
          restore-keys: |
            swarm-memory-

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          cd swarm
          npm ci --legacy-peer-deps

      - name: Run Resonance Check
        run: npx tsx scripts/resonance_check.ts
        env:
          TRUE_AI_INDEPENDENCE: "true"

      # 🦀 TRANSCENDENCE: Build Rust Quantum Bridge
      - name: Build Quantum Bridge
        run: |
          cargo generate-lockfile --manifest-path swarm/core/quantum_bridge/Cargo.toml
          cargo build --release --locked --manifest-path swarm/core/quantum_bridge/Cargo.toml
          echo "🦀 Quantum Bridge compiled for cloud execution"

      # 📡 REALITY INJECTION 2.0: Harvest context before execution
      - name: Run Reality Pulse 2.0
        run: |
          npx tsx scripts/reality_pulse.ts
          npm run swarm:analyze
        env:
          TRUE_AI_INDEPENDENCE: "true"

      # 🔍 DIAGNOSTICS: Generate reality signals for Inception
      - name: Pre-Pulse Diagnostics
        run: |
          npm run build > build_logs.txt 2>&1 || echo "Build failed (as expected for diagnosis)" > build_logs.txt
          npm run lint -- --format json > lint_output.json 2>&1 || echo "[]" > lint_output.json
        continue-on-error: true

      # ⚛️ INTELLIGENCE PULSE: Unify Singularity, Brain, and Oracle
      - name: Configure Git Identity
        run: |
          git config --global user.email "fernando@appforge.ai"
          git config --global user.name "Fernando Garza (Sovereign Swarm)"

      - name: Run Intelligence Pulse
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRUE_AI_INDEPENDENCE: "true"
          NODE_ID: "GA-SWARM-PULSE"
          RESONANCE_PORT: "11435"
        run: |
          cd swarm
          npx tsx intelligence_pulse.ts

      - name: Validate Swarm runtime secrets (masked)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mask_and_report() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              echo "✅ $name is configured"
            else
              echo "⚪ $name is not configured"
            fi
          }

          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          }

          mask_and_report "BASE44_API_KEY" "$BASE44_API_KEY"
          mask_and_report "BASE44_APP_ID" "$BASE44_APP_ID"
          mask_and_report "OPENAI_API_KEY" "$OPENAI_API_KEY"
          mask_and_report "ANTHROPIC_API_KEY" "$ANTHROPIC_API_KEY"
          mask_and_report "GEMINI_API_KEY" "$GEMINI_API_KEY"
          mask_and_report "XAI_API_KEY" "$XAI_API_KEY"
          mask_and_report "DISCORD_TOKEN" "$DISCORD_TOKEN"
          mask_and_report "TELEGRAM_BOT_TOKEN" "$TELEGRAM_BOT_TOKEN"

          require_secret "BASE44_API_KEY" "$BASE44_API_KEY"
          require_secret "BASE44_APP_ID" "$BASE44_APP_ID"

          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$XAI_API_KEY" ]; then
            echo "❌ Missing AI provider key. Configure at least one: OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, or XAI_API_KEY"
            exit 1
          fi

          echo "✅ Swarm runtime secrets validated successfully"

      - name: Run Swarm (One-Shot)
        continue-on-error: true
        env:
          # AI Keys
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

          # App Config
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}

          # 📡 GATEWAY: Multi-Transport Sovereign Bridge
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          # 🏦 SOLANA REALITY MODE (Requires GitHub Secrets)
          SOLANA_WALLET_ADDRESS: ${{ secrets.SOLANA_WALLET_ADDRESS }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          REAL_TRADING_ENABLED: ${{ secrets.SOLANA_PRIVATE_KEY != '' && secrets.SOLANA_RPC_URL != '' && 'true' || 'false' }}
          SWARM_REALITY_MODE: ${{ secrets.SOLANA_PRIVATE_KEY != '' && secrets.SOLANA_RPC_URL != '' && 'true' || 'false' }}
          SWARM_AUTONOMOUS_TRADING_ENABLED: ${{ secrets.SOLANA_PRIVATE_KEY != '' && secrets.SOLANA_RPC_URL != '' && 'true' || 'false' }}

          # Mode
          ONE_SHOT: "true"
          TRUE_AI_INDEPENDENCE: "true"
        run: |
          # Configure Git for potential commits
          git config --global user.name "Fernando Garza (Sovereign Swarm)"
          git config --global user.email "fernando@appforge.ai"

          # Run the Daemon (One-Shot Cycle) without failing the whole workflow on transient runtime issues
          cd swarm
          set +e
          NODE_ID="GA-AUTONOMOUS" MESH_ENABLED="true" npm start 2>&1 | tee ../swarm_one_shot.log
          SWARM_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$SWARM_EXIT_CODE" -ne 0 ]; then
            echo "::warning::Swarm (One-Shot) exited with code $SWARM_EXIT_CODE. Continuing workflow so diagnostics and follow-up gates still run."
          fi


      # 🧬 SINGULARITY VERIFICATION: Validate evolutionary progress
      - name: Run Singularity Verification
        run: |
          npx tsx scripts/verify_evolution.ts
        env:
          TRUE_AI_INDEPENDENCE: "true"

      # 📊 DETERMINISTIC SCORING: Benchmark & Output Persistence
      - name: Benchmark Swarm Intelligence
        run: npm run swarm:benchmark
        env:
          TRUE_AI_INDEPENDENCE: "true"

      # ⚖️ REGRESSION GATE 1: Enforce Deterministic Upgrades
      - name: Enforce Deterministic Score
        run: npx tsx scripts/enforce_deterministic_score.ts

      # ⚖️ REGRESSION GATE 2: Global Test Suite Run
      - name: Run Global Regression Tests
        run: |
          npm install
          npm run test:all
        continue-on-error: false

      # 📡 Upload evolution artifacts for persistence
      - name: Upload Swarm Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-evolution-${{ github.run_number }}
          path: |
            swarm/swarm_memory.json
            src/data/quantum_state.json
            src/data/quantum_predictions.json
            swarm_one_shot.log
          retention-days: 30

      - name: Open Evolution Pull Request
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_ID: "GA-AUTONOMOUS-PR"
        run: |
          npx tsx scripts/create_evolution_pr.ts
