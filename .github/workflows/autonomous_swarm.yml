name: Autonomous Swarm Cycle

on:
  schedule:
    - cron: "*/15 * * * *" # Run every 15 minutes
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  swarm-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allow committing back to repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Full history for rebasing

      - name: Run Resonance Check
        run: npx tsx scripts/resonance_check.ts
        env:
          TRUE_AI_INDEPENDENCE: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 🦀 TRANSCENDENCE: Rust Toolchain for Quantum Bridge
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # ⚡ CACHE: Node.js dependencies
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            swarm/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('swarm/package-lock.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 🦀 CACHE: Rust build artifacts
      - name: Cache Rust Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            swarm/core/quantum_bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('swarm/core/quantum_bridge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 📦 CACHE: Swarm Memory (evolution state persistence)
      - name: Cache Swarm Memory
        uses: actions/cache@v4
        with:
          path: |
            swarm/swarm_memory.json
            src/data/quantum_state.json
            src/data/quantum_predictions.json
            src/data/bounty_ledger.json
            src/data/economic_state.json
          key: swarm-memory-${{ github.run_number }}
          restore-keys: |
            swarm-memory-

      - name: Install Swarm Dependencies
        run: |
          cd swarm
          npm install

      # 🦀 TRANSCENDENCE: Build Rust Quantum Bridge
      - name: Build Quantum Bridge
        run: |
          cd swarm/core/quantum_bridge
          cargo build --release
          echo "🦀 Quantum Bridge compiled for cloud execution"

      # 📡 REALITY INJECTION 2.0: Harvest context before execution
      - name: Run Reality Pulse 2.0
        run: |
          npx tsx scripts/reality_pulse.ts
        env:
          TRUE_AI_INDEPENDENCE: "true"

      # ⚛️ INTELLIGENCE PULSE: Unify Singularity, Brain, and Oracle
      - name: Run Intelligence Pulse
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRUE_AI_INDEPENDENCE: "true"
          NODE_ID: "GA-SWARM-PULSE"
          RESONANCE_PORT: "11435"
        run: |
          cd swarm
          npx tsx intelligence_pulse.ts

      - name: Run Swarm (One-Shot)
        env:
          # AI Keys
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

          # App Config
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}

          # 🏦 SOLANA REALITY MODE (Requires GitHub Secrets)
          SOLANA_WALLET_ADDRESS: ${{ secrets.SOLANA_WALLET_ADDRESS }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          REAL_TRADING_ENABLED: "true"
          SWARM_REALITY_MODE: "true"
          SWARM_AUTONOMOUS_TRADING_ENABLED: "true"

          # Mode
          ONE_SHOT: "true"
          TRUE_AI_INDEPENDENCE: "true"
        run: |
          # Configure Git for potential commits
          git config --global user.name "AppForge Swarm"
          git config --global user.email "swarm@appforge.bot"

          # Run the Daemon (One-Shot Cycle)
          cd swarm
          npm start

      # 🧬 SINGULARITY VERIFICATION: Validate evolutionary progress
      - name: Run Singularity Verification
        run: |
          npx tsx scripts/verify_evolution.ts
        env:
          TRUE_AI_INDEPENDENCE: "true"

      # 📡 Upload evolution artifacts for persistence
      - name: Upload Swarm Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-evolution-${{ github.run_number }}
          path: |
            swarm/swarm_memory.json
            src/data/quantum_state.json
            src/data/quantum_predictions.json
          retention-days: 30

      - name: Push any Swarm artifacts
        run: |
          git pull --rebase origin main
          git add src/data/quantum_*.json
          git add src/data/reality_pulse.json
          git add src/data/quantum_coherence_state.json
          git add src/data/bounty_ledger.json
          git add src/data/economic_state.json
          git add swarm/core/*.ts
          git add swarm/intelligence_pulse.ts
          git commit -m "chore: swarm autonomous update [Bounty System] [Mesh Sync] [skip ci]" || echo "No changes to commit"
          git push
