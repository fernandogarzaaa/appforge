name: Swarm Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Swarm Orchestrator"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate SWARM_STATUS.md (TypeScript)
        run: npx tsx scripts/ci_manager.ts DASHBOARD
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Commit SWARM_STATUS.md
        run: |
          git config user.name "swarm-bot"
          git config user.email "swarm-bot@users.noreply.github.com"
          git add SWARM_STATUS.md
          git commit -m "chore: update SWARM_STATUS.md [bot]" || echo "No changes to commit."
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
