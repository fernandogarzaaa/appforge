name: Swarm Dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - "SWARM_STATUS.md"
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            swarm/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          if [ -d swarm ]; then
            cd swarm && npm ci --legacy-peer-deps
          fi

      - name: Install tsx globally
        run: npm install --global tsx

      - name: Generate SWARM_STATUS.md (TypeScript)
        run: npx tsx scripts/ci_manager.ts DASHBOARD
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Detect semantic dashboard changes
        id: detect_changes
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch SWARM_STATUS.md >/dev/null 2>&1; then
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
            echo "reason=new-file" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_FILE=$(mktemp)
          NEW_FILE=$(mktemp)
          OLD_NORM=$(mktemp)
          NEW_NORM=$(mktemp)

          git show HEAD:SWARM_STATUS.md > "$OLD_FILE" || true
          cp SWARM_STATUS.md "$NEW_FILE"

          tr -d '[:space:]' < "$OLD_FILE" > "$OLD_NORM"
          tr -d '[:space:]' < "$NEW_FILE" > "$NEW_NORM"

          if cmp -s "$OLD_NORM" "$NEW_NORM"; then
            echo "should_commit=false" >> "$GITHUB_OUTPUT"
            echo "reason=whitespace-only" >> "$GITHUB_OUTPUT"
          else
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
            echo "reason=meaningful-content-change" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit SWARM_STATUS.md
        id: commit_dashboard
        if: steps.detect_changes.outputs.should_commit == 'true'
        run: |
          set -euo pipefail
          git config user.name "swarm-bot"
          git config user.email "swarm-bot@users.noreply.github.com"
          git add SWARM_STATUS.md
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "chore: update SWARM_STATUS.md [bot]"
            attempt=1
            max_attempts=3
            push_succeeded=false
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Push attempt ${attempt}/${max_attempts}"
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Dashboard push succeeded."
                push_succeeded=true
                echo "push_mode=direct" >> "$GITHUB_OUTPUT"
                break
              fi

              git rebase --abort || true
              attempt=$((attempt + 1))
              sleep 5
            done

            if [ "$push_succeeded" != "true" ]; then
              fallback_branch="swarm-bot/dashboard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              git checkout -B "$fallback_branch"
              git push -u origin "$fallback_branch"

              pr_title="chore: update SWARM_STATUS.md [bot]"
              pr_body="Automated fallback PR because direct push to main failed after ${max_attempts} attempts.\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              gh pr create --base main --head "$fallback_branch" --title "$pr_title" --body "$pr_body"
              echo "push_mode=pr" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dashboard bot summary
        if: always()
        run: |
          commit_action="${{ steps.commit_dashboard.outputs.push_mode }}"
          if [ -z "$commit_action" ]; then
            commit_action="none"
          fi

          {
            echo "## Swarm Dashboard Bot"
            echo "- Semantic change: ${{ steps.detect_changes.outputs.reason }}"
            if [ "${{ steps.detect_changes.outputs.should_commit }}" = "true" ]; then
              echo "- Commit action: ${commit_action}"
            else
              echo "- Commit action: skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Escalate repeated dashboard failures
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          CURRENT_RUN="${GITHUB_RUN_ID}"

          PREVIOUS_STATUS=$(gh run list \
            --workflow "swarm-dashboard.yml" \
            --limit 10 \
            --json databaseId,status,conclusion \
            --jq "map(select((.databaseId|tostring) != \"${CURRENT_RUN}\" and .status == \"completed\"))[0].conclusion // \"none\"")

          if [ "$PREVIOUS_STATUS" != "failure" ]; then
            echo "Previous completed dashboard run was '$PREVIOUS_STATUS'; no escalation issue needed."
            exit 0
          fi

          ISSUE_TITLE="swarm-bot: repeated dashboard workflow failures"
          ISSUE_LABELS="swarm-bot,automation,incident"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
Swarm Dashboard failed in **2 consecutive completed runs**.

- Workflow: \`swarm-dashboard.yml\`
- Current run: ${RUN_URL}
- Trigger: ${GITHUB_EVENT_NAME}

Please investigate CI environment, Redis connectivity, and bot commit/push path.
EOF
)

          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "in:title ${ISSUE_TITLE}" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
            echo "Updated existing escalation issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body "$BODY" --label "$ISSUE_LABELS"
            echo "Created new escalation issue."
          fi
