name: AppForge Task Runner

on:
  workflow_dispatch:
    inputs:
      task_description:
        description: "Describe the task AppForge should execute"
        required: true
        type: string

concurrency:
  group: appforge-task-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TASK_DESCRIPTION: ${{ inputs.task_description }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Initialize run
        id: init
        run: |
          RUN_ID="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          RUN_DIR="runs/$RUN_ID"
          mkdir -p "$RUN_DIR/generated" "$RUN_DIR/logs"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

      - name: Planning
        env:
          RUN_ID: ${{ steps.init.outputs.run_id }}
          RUN_DIR: ${{ steps.init.outputs.run_dir }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          run_id = os.environ["RUN_ID"]
          run_dir = os.environ["RUN_DIR"]
          task_description = os.environ.get("TASK_DESCRIPTION", "").strip()

          lowered = task_description.lower()
          tasks = ["design architecture"]
          if any(k in lowered for k in ["api", "backend", "service", "crud"]):
              tasks.extend(["generate backend", "generate database schema"])
          if any(k in lowered for k in ["todo", "frontend", "ui", "app"]):
              tasks.append("generate frontend scaffolding")
          tasks.extend(["generate tests", "validate build"])

          plan = {
              "run_id": run_id,
              "task_description": task_description,
              "tasks": tasks,
              "created_at": datetime.now(timezone.utc).isoformat(),
          }

          with open(os.path.join(run_dir, "plan.json"), "w", encoding="utf-8") as f:
              json.dump(plan, f, indent=2)
          PY

      - name: Execute tasks, validate, and iterate
        env:
          RUN_ID: ${{ steps.init.outputs.run_id }}
          RUN_DIR: ${{ steps.init.outputs.run_dir }}
        run: |
          set +e

          emit_event() {
            EVENT_NAME="$1"
            TASK_NAME="$2"
            DURATION="$3"
            python3 - "$RUN_DIR/telemetry.jsonl" "$EVENT_NAME" "$RUN_ID" "$TASK_NAME" "$DURATION" <<'PY'
            import json
            import sys
            from datetime import datetime, timezone

            path, event, run_id, task, duration = sys.argv[1:]
            entry = {
                "event": event,
                "run_id": run_id,
                "task": task,
                "timestamp": datetime.now(timezone.utc).isoformat(),
                "duration": float(duration),
            }
            with open(path, "a", encoding="utf-8") as f:
                f.write(json.dumps(entry) + "\n")
            PY
          }

          emit_event "run_started" "workflow" "0"
          ATTEMPT=1
          MAX_ATTEMPTS=3
          FINAL_STATUS=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            ATTEMPT_STARTED=$(date +%s)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS" | tee -a "$RUN_DIR/logs/execution.log"

            if [ "$ATTEMPT" -gt 1 ]; then
              echo "Refinement pass $ATTEMPT based on previous validation errors" > "$RUN_DIR/generated/remediation-attempt-$ATTEMPT.md"
            fi

            emit_event "plan_generated" "plan.json" "0"

            python3 - "$RUN_DIR/plan.json" "$RUN_DIR" "$ATTEMPT" <<'PY'
            import json
            import os
            import re
            import sys

            plan_path, run_dir, attempt = sys.argv[1], sys.argv[2], int(sys.argv[3])
            with open(plan_path, "r", encoding="utf-8") as f:
                plan = json.load(f)

            for idx, task in enumerate(plan.get("tasks", []), start=1):
                slug = re.sub(r"[^a-z0-9]+", "-", task.lower()).strip("-") or f"task-{idx}"
                task_file = os.path.join(run_dir, "generated", f"{idx:02d}-{slug}-attempt-{attempt}.md")
                with open(task_file, "w", encoding="utf-8") as out:
                    out.write(f"# Task {idx}: {task}\\n")
                    out.write(f"Attempt: {attempt}\\n\\n")
                    out.write("Generated by AppForge Task Runner workflow.\\n")

                if "backend" in task:
                    with open(os.path.join(run_dir, "generated", "app.js"), "w", encoding="utf-8") as out:
                        out.write("const express = require('express');\\n")
                        out.write("const app = express();\\n")
                        out.write("app.get('/health', (_req, res) => res.json({status:'ok'}));\\n")
                        out.write("module.exports = app;\\n")
                if "database schema" in task:
                    with open(os.path.join(run_dir, "generated", "schema.sql"), "w", encoding="utf-8") as out:
                        out.write("CREATE TABLE todos (id SERIAL PRIMARY KEY, title TEXT NOT NULL, completed BOOLEAN DEFAULT FALSE);\\n")
                if "tests" in task:
                    with open(os.path.join(run_dir, "generated", "app.test.js"), "w", encoding="utf-8") as out:
                        out.write("describe('placeholder test', () => {\\n")
                        out.write("  it('passes', () => { expect(true).toBe(true); });\\n")
                        out.write("});\\n")
            PY

            TASKS=$(python3 -c 'import json,sys; plan=json.load(open(sys.argv[1], "r", encoding="utf-8")); print("\n".join(plan.get("tasks", [])))' "$RUN_DIR/plan.json")

            while IFS= read -r TASK; do
              [ -z "$TASK" ] && continue
              TS=$(date +%s)
              emit_event "task_started" "$TASK" "0"
              sleep 1
              DURATION=$(( $(date +%s) - TS ))
              emit_event "task_completed" "$TASK" "$DURATION"
            done <<< "$TASKS"

            VALIDATION_STATUS=0
            {
              echo "=== npm run lint ==="
              npm run lint
            } > "$RUN_DIR/logs/lint-attempt-$ATTEMPT.log" 2>&1 || VALIDATION_STATUS=1

            {
              echo "=== npm run test ==="
              npm run test
            } > "$RUN_DIR/logs/test-attempt-$ATTEMPT.log" 2>&1 || VALIDATION_STATUS=1

            {
              echo "=== npm run build ==="
              npm run build
            } > "$RUN_DIR/logs/build-attempt-$ATTEMPT.log" 2>&1 || VALIDATION_STATUS=1

            ATTEMPT_DURATION=$(( $(date +%s) - ATTEMPT_STARTED ))
            if [ "$VALIDATION_STATUS" -eq 0 ]; then
              emit_event "validation_passed" "validation" "$ATTEMPT_DURATION"
              FINAL_STATUS=0
              break
            else
              emit_event "validation_failed" "validation" "$ATTEMPT_DURATION"
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          if [ "$FINAL_STATUS" -eq 0 ]; then
            emit_event "run_completed" "workflow" "0"
            exit 0
          fi

          echo "Validation failed after $MAX_ATTEMPTS attempts" | tee -a "$RUN_DIR/logs/execution.log"
          emit_event "run_completed" "workflow" "0"
          exit 1

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appforge-task-run-${{ steps.init.outputs.run_id }}
          path: ${{ steps.init.outputs.run_dir }}
          if-no-files-found: error
          retention-days: 14
