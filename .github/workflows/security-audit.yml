name: Security Audit

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run security audit daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps
      
      - name: Run security audit
        working-directory: backend
        run: npm run security:audit:ci
        continue-on-error: true
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: backend/security-audits/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const auditDir = './backend/security-audits';
            
            // Find latest audit report
            const files = fs.readdirSync(auditDir).filter(f => f.endsWith('.md'));
            if (files.length === 0) return;
            
            const latestFile = files.sort().pop();
            const report = fs.readFileSync(path.join(auditDir, latestFile), 'utf-8');
            
            // Extract security score
            const scoreMatch = report.match(/Security Score: (\d+)\/100/);
            const score = scoreMatch ? scoreMatch[1] : 'Unknown';
            
            // Create comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Audit Report\n\n**Security Score**: ${score}/100\n\n[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nFor details, download the security audit artifacts.`
            });

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps
      
      - name: Check for vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Generate SBOM (Software Bill of Materials)
        working-directory: backend
        run: npm sbom --sbom-format=json --sbom-output=sbom.json 2>/dev/null || echo "SBOM generation not available"
        continue-on-error: true

  api-documentation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps
      
      - name: Validate OpenAPI spec
        working-directory: backend
        run: |
          npx swagger-cli validate src/config/swagger.js
        continue-on-error: true
      
      - name: Generate API documentation
        working-directory: backend
        run: |
          npx swagger-cli bundle -o api-docs.json src/config/swagger.js
        continue-on-error: true
      
      - name: Upload API documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: backend/api-docs.json
          retention-days: 7

  notify-security:
    runs-on: ubuntu-latest
    needs: [security-audit]
    if: failure()
    
    steps:
      - name: Notify security team
        run: |
          echo "⚠️ Security audit detected issues in ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
