name: Frontend QA Swarm

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 0 * * *" # Run daily at midnight
    workflow_dispatch:

jobs:
    frontend-qa:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install Dependencies
              run: npm install --legacy-peer-deps

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps chromium

            - name: Setup PM2
              run: npm install -g pm2

            - name: Start Services
              run: |
                  pm2 start "npm run dev" --name "frontend"
                  pm2 start "npx tsx scripts/swarm_telemetry_server.ts" --name "telemetry"
                  sleep 10 # Give services time to ignite
              env:
                  NODE_ENV: development
                  BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
                  CHIMERA_API_KEY: ${{ secrets.CHIMERA_API_KEY }}

            - name: Run Frontend QA Swarm
              run: npx tsx scripts/run_frontend_qa_swarm.ts
              env:
                  BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
                  CHIMERA_API_KEY: ${{ secrets.CHIMERA_API_KEY }}
                  TRUE_AI_INDEPENDENCE: "true"

            - name: Run Generated Playwright Tests
              run: npx playwright test tests/e2e/generated_swarm_test_*.spec.ts
              continue-on-error: true

            - name: Upload QA Artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: qa-swarm-results-${{ github.run_id }}
                  path: |
                      tests/e2e/generated_swarm_test_*.spec.ts
                      playwright-report/
                  retention-days: 7

            - name: Cleanup
              run: pm2 delete all
