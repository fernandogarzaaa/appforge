name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: npm run test

      - name: Build Production
        run: npm run build:production
        env:
          NODE_ENV: production
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}

      - name: Health Check Build
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build failed - index.html not found in dist"
            exit 1
          fi
          echo "✅ Build artifacts verified"

      - name: Deploy to Production
        id: deploy
        run: |
          echo "🚀 Deploying to production..."
          # Add your deployment command here
          # Examples:
          # - vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          # - railway up --service appforge
          # - aws s3 sync dist/ s3://your-bucket --delete
          # - rsync -avz dist/ user@server:/var/www/appforge
          echo "::notice::Deployment step - configure your deployment method"
          echo "deployed=true" >> $GITHUB_OUTPUT
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        continue-on-error: true

      - name: Post-Deploy Health Check
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          echo "🏥 Running post-deploy health check..."
          # Add health check for your deployed app
          # curl -f https://appforge.fun/health || exit 1
          echo "::notice::Post-deploy health check - configure your health endpoint"

      - name: Notify Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-build-${{ github.run_number }}
          path: dist/
          retention-days: 7
          if-no-files-found: ignore
