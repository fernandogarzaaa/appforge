name: Deploy to Vercel Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "SWARM_STATUS.md"
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Build
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - dist directory not found"
            exit 1
          fi
          echo "✅ Build verified - $(du -sh dist)"

      - name: Check Vercel deployment configuration
        id: vercel_config
        run: |
          missing=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing="${missing} VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && missing="${missing} VERCEL_ORG_ID"
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing="${missing} VERCEL_PROJECT_ID"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Vercel deploy; missing secrets: ${missing# }"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: steps.vercel_config.outputs.ready == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ steps.vercel_config.outputs.ready }}" = "true" ]; then
            echo "✅ Vercel deployment executed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Vercel deployment skipped. Missing secrets: ${{ steps.vercel_config.outputs.missing }}" >> "$GITHUB_STEP_SUMMARY"
          fi
