name: Curiosity Engine Scan

on:
    schedule:
        - cron: "0 */4 * * *" # Run every 4 hours
    workflow_dispatch: # Allow manual trigger

concurrency:
    group: curiosity-scan-${{ github.ref }}
    cancel-in-progress: true

jobs:
    curiosity-scan:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: swarm/package-lock.json

            - name: Install Project Dependencies
              run: npm ci --legacy-peer-deps

            - name: Install Swarm Dependencies
              run: |
                  cd swarm
                  npm ci --legacy-peer-deps

            - name: Run Curiosity Scan
              env:
                  BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
                  BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  CURIOSITY_SCAN_LIMIT: "${{ vars.CURIOSITY_SCAN_LIMIT || '8' }}"
                  CURIOSITY_SYNTHESIS_LIMIT: "${{ vars.CURIOSITY_SYNTHESIS_LIMIT || '3' }}"
              run: |
                  npx tsx scripts/trigger_curiosity.ts
