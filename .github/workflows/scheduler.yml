name: Bot Scheduler
on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 mins
jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Autonomous Cycle
        run: |
          curl -X POST ${{ secrets.BASE44_API_URL }}/functions/v1/autonomousCycle \
          -H "Authorization: Bearer ${{ secrets.BASE44_API_KEY }}"
