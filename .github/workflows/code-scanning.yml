name: Code Scanning & Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run code scanning weekly on Monday at 4 AM UTC
    - cron: '0 4 * * 1'

jobs:
  codeql-analysis:
    name: CodeQL Security Scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses:
            - GPL-2.0
            - GPL-3.0

  sonarcloud-analysis:
    name: SonarCloud Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clones should be disabled for better analysis
          fetch-depth: 0

      # SonarCloud is optional until configured. If SONAR_TOKEN is not set,
      # the scan will be skipped and a helpful message will be printed.
      # Setup steps are gated to avoid unnecessary work when SonarCloud is disabled.
      - name: SonarCloud configuration notice
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: |
          echo "SonarCloud scan skipped: SONAR_TOKEN secret is not configured."
          echo "To enable: create a SonarCloud project under org 'fernandogarzaaa'"
          echo "with project key 'appforge', then add SONAR_TOKEN in GitHub"
          echo "Settings > Secrets and variables > Actions."

      - name: Setup Node.js
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ secrets.SONAR_TOKEN != '' }}
        run: npm ci

      - name: Run tests with coverage
        if: ${{ secrets.SONAR_TOKEN != '' }}
        run: npm run test:coverage
        continue-on-error: true

      # SonarCloud configuration:
      # - Set SONAR_TOKEN secret in this repo's GitHub Actions secrets.
      # - Create the SonarCloud project under org 'fernandogarzaaa'.
      # - Ensure the project key matches 'appforge' (see sonar-project.properties).
      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=appforge
            -Dsonar.organization=fernandogarzaaa
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  eslint-analysis:
    name: ESLint Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
      
      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          report-json: "eslint-report.json"
        continue-on-error: true
