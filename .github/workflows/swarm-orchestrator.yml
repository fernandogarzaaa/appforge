name: Swarm Orchestrator

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_run:
    workflows:
      - Autonomous Swarm Cycle
      - Quantum Self-Evolution
      - Curiosity Engine Scan
      - Frontend QA Swarm
      - Evolution Benchmark Gate
      - Iron Brain CI — Ghost Brain
    types:
      - completed
  workflow_dispatch:
    inputs:
      force_action:
        description: "Force a specific agent (autonomous_swarm|evolution_benchmark|quantum_evolution|curiosity_scan|frontend_qa_swarm|appforge_task_runner)"
        required: false
      task_description:
        description: "Optional task description when force_action=appforge_task_runner"
        required: false
      force_override:
        description: "Allow override of state-machine transition guards (true|false)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          if [ -d swarm ]; then
            cd swarm && npm ci --legacy-peer-deps
          fi

      # Read what triggered this orchestrator run
      - name: Capture triggering event context
        id: event
        run: |
          TRIGGER="${{ github.event_name }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          RUN_ID="${{ github.event.workflow_run.id || github.run_id }}"
          UPDATED_AT="${{ github.event.workflow_run.updated_at }}"
          echo "trigger=$TRIGGER" >> $GITHUB_OUTPUT
          echo "workflow_name=$WORKFLOW_NAME" >> $GITHUB_OUTPUT
          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "updated_at=$UPDATED_AT" >> $GITHUB_OUTPUT
          echo "Orchestrator triggered by: $TRIGGER | $WORKFLOW_NAME | $CONCLUSION | $UPDATED_AT"

      - name: Cooldown guard for workflow_run bursts
        id: cooldown
        run: |
          COOLDOWN_MINUTES="${SWARM_ORCHESTRATOR_COOLDOWN_MINUTES:-5}"

          if [ "${{ steps.event.outputs.trigger }}" = "workflow_run" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_run trigger should be processed immediately" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For scheduled/manual runs, keep a lightweight cooldown to avoid rapid re-dispatch.
          if [ -z "${{ steps.event.outputs.updated_at }}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=No upstream timestamp for non-workflow_run trigger" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          upstream_epoch="$(date -u -d "${{ steps.event.outputs.updated_at }}" +%s || echo 0)"
          min_delta="$((COOLDOWN_MINUTES * 60))"
          actual_delta="$((now_epoch - upstream_epoch))"

          if [ "$upstream_epoch" -eq 0 ] || [ "$actual_delta" -ge "$min_delta" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=Cooldown passed for non-workflow_run trigger" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=Cooldown active (${actual_delta}s < ${min_delta}s)" >> "$GITHUB_OUTPUT"
          fi
        env:
          SWARM_ORCHESTRATOR_COOLDOWN_MINUTES: ${{ vars.SWARM_ORCHESTRATOR_COOLDOWN_MINUTES }}

      - name: Cooldown decision
        if: steps.cooldown.outputs.proceed != 'true'
        run: |
          echo "Skipping orchestration due to cooldown: ${{ steps.cooldown.outputs.reason }}"

      # Download the completing agent's output artifact (only on workflow_run events)
      - name: Download agent output artifact
        if: steps.cooldown.outputs.proceed == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != ''
        uses: actions/download-artifact@v4
        continue-on-error: true # Agent may not have produced an artifact
        with:
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: "*_output.json"
          path: agent_outputs/

      # Unified Orchestration Decision (TypeScript)
      - name: Swarm Orchestration Decision
        id: decide
        if: steps.cooldown.outputs.proceed == 'true'
        run: npx tsx scripts/ci_manager.ts ORCHESTRATE
        env:
          TRIGGER: ${{ steps.event.outputs.trigger }}
          FORCE_ACTION: ${{ inputs.force_action }}
          CONCLUSION: ${{ steps.event.outputs.conclusion }}
          WORKFLOW_NAME: ${{ steps.event.outputs.workflow_name }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          RUN_ID: ${{ steps.event.outputs.run_id }}
          FORCE_OVERRIDE: ${{ inputs.force_override }}

      - name: Control-plane queue result
        if: steps.cooldown.outputs.proceed == 'true'
        run: |
          echo "Swarm command queued=${{ steps.decide.outputs.queued_command }}"
          echo "Next action=${{ steps.decide.outputs.next_action }}"
          echo "Reason=${{ steps.decide.outputs.reason }}"

      # Dashboard update is automated via workflow_run triggers
