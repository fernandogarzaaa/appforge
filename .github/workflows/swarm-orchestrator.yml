name: Swarm Orchestrator

on:
  schedule:
    - cron: "0 * * * *"
  workflow_run:
    workflows:
      - Autonomous Swarm Cycle
      - Quantum Self-Evolution
      - Curiosity Engine Scan
      - Frontend QA Swarm
      - Evolution Benchmark Gate
      - Iron Brain CI — Ghost Brain
    types:
      - completed
  workflow_dispatch:
    inputs:
      force_action:
        description: "Force a specific agent (autonomous_swarm|quantum_evolution|curiosity_scan|frontend_qa_swarm)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          if [ -d swarm ]; then
            cd swarm && npm ci --legacy-peer-deps
          fi

      # Read what triggered this orchestrator run
      - name: Capture triggering event context
        id: event
        run: |
          TRIGGER="${{ github.event_name }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          UPDATED_AT="${{ github.event.workflow_run.updated_at }}"
          echo "trigger=$TRIGGER" >> $GITHUB_OUTPUT
          echo "workflow_name=$WORKFLOW_NAME" >> $GITHUB_OUTPUT
          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "updated_at=$UPDATED_AT" >> $GITHUB_OUTPUT
          echo "Orchestrator triggered by: $TRIGGER | $WORKFLOW_NAME | $CONCLUSION | $UPDATED_AT"

      - name: Cooldown guard for workflow_run bursts
        id: cooldown
        run: |
          COOLDOWN_MINUTES="${SWARM_ORCHESTRATOR_COOLDOWN_MINUTES:-5}"

          if [ "${{ steps.event.outputs.trigger }}" = "workflow_run" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_run trigger should be processed immediately" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For scheduled/manual runs, keep a lightweight cooldown to avoid rapid re-dispatch.
          if [ -z "${{ steps.event.outputs.updated_at }}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=No upstream timestamp for non-workflow_run trigger" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          upstream_epoch="$(date -u -d "${{ steps.event.outputs.updated_at }}" +%s || echo 0)"
          min_delta="$((COOLDOWN_MINUTES * 60))"
          actual_delta="$((now_epoch - upstream_epoch))"

          if [ "$upstream_epoch" -eq 0 ] || [ "$actual_delta" -ge "$min_delta" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=Cooldown passed for non-workflow_run trigger" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=Cooldown active (${actual_delta}s < ${min_delta}s)" >> "$GITHUB_OUTPUT"
          fi
        env:
          SWARM_ORCHESTRATOR_COOLDOWN_MINUTES: ${{ vars.SWARM_ORCHESTRATOR_COOLDOWN_MINUTES }}

      - name: Cooldown decision
        if: steps.cooldown.outputs.proceed != 'true'
        run: |
          echo "Skipping orchestration due to cooldown: ${{ steps.cooldown.outputs.reason }}"

      # Download the completing agent's output artifact (only on workflow_run events)
      - name: Download agent output artifact
        if: steps.cooldown.outputs.proceed == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != ''
        uses: actions/download-artifact@v4
        continue-on-error: true # Agent may not have produced an artifact
        with:
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: "*_output.json"
          path: agent_outputs/

      # Unified Orchestration Decision (TypeScript)
      - name: Validate dispatch token
        id: dispatch-token
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          if [ -n "$BOT_GITHUB_TOKEN" ]; then
            echo "can_dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_dispatch=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BOT_GITHUB_TOKEN is not configured; orchestration dispatch steps will be skipped."
          fi

      - name: Swarm Orchestration Decision
        id: decide
        if: steps.cooldown.outputs.proceed == 'true'
        run: npx tsx scripts/ci_manager.ts ORCHESTRATE
        env:
          TRIGGER: ${{ steps.event.outputs.trigger }}
          FORCE_ACTION: ${{ inputs.force_action }}
          CONCLUSION: ${{ steps.event.outputs.conclusion }}
          WORKFLOW_NAME: ${{ steps.event.outputs.workflow_name }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      # Dispatch the right agent based on decision
      - name: Dispatch → Autonomous Swarm
        if: steps.cooldown.outputs.proceed == 'true' && steps.dispatch-token.outputs.can_dispatch == 'true' && steps.decide.outputs.next_action == 'autonomous_swarm' && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Autonomous Swarm Cycle')
        run: |
          gh workflow run "Autonomous Swarm Cycle" --ref main
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Dispatch → Quantum Evolution
        if: steps.cooldown.outputs.proceed == 'true' && steps.dispatch-token.outputs.can_dispatch == 'true' && steps.decide.outputs.next_action == 'quantum_evolution' && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Quantum Self-Evolution')
        run: |
          gh workflow run "Quantum Self-Evolution" \
            --ref main \
            --field green_light=true \
            --field reason="${{ steps.decide.outputs.reason }}"
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Dispatch → Curiosity Scan
        if: steps.cooldown.outputs.proceed == 'true' && steps.dispatch-token.outputs.can_dispatch == 'true' && steps.decide.outputs.next_action == 'curiosity_scan' && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Curiosity Engine Scan')
        run: |
          gh workflow run "Curiosity Engine Scan" --ref main
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Dispatch → Frontend QA Swarm
        if: steps.cooldown.outputs.proceed == 'true' && steps.dispatch-token.outputs.can_dispatch == 'true' && steps.decide.outputs.next_action == 'frontend_qa_swarm' && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Frontend QA Swarm')
        run: |
          gh workflow run "Frontend QA Swarm" \
            --ref main \
            --field context='{"reason":"${{ steps.decide.outputs.reason }}"}'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Dispatch skipped (missing token)
        if: steps.cooldown.outputs.proceed == 'true' && steps.dispatch-token.outputs.can_dispatch != 'true'
        run: echo "::notice::No BOT_GITHUB_TOKEN configured; skipping workflow dispatch steps."

      # Dashboard update is automated via workflow_run triggers
