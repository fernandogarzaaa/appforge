name: Swarm Orchestrator

on:
  schedule:
    - cron: "0 * * * *"
  workflow_run:
    workflows:
      - Autonomous Swarm Cycle
      - Quantum Self-Evolution
      - Curiosity Engine Scan
      - Frontend QA Swarm
      - Evolution Benchmark Gate
      - Iron Brain CI — Ghost Brain
      - Node.js CI
      - Code Scanning & Quality
    types:
      - completed
  workflow_dispatch:
    inputs:
      force_action:
        description: "Force a specific agent (autonomous_swarm|quantum_evolution|curiosity_scan)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          if [ -d swarm ]; then
            cd swarm && npm ci --legacy-peer-deps
          fi

      # Read what triggered this orchestrator run
      - name: Capture triggering event context
        id: event
        run: |
          TRIGGER="${{ github.event_name }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "trigger=$TRIGGER" >> $GITHUB_OUTPUT
          echo "workflow_name=$WORKFLOW_NAME" >> $GITHUB_OUTPUT
          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Orchestrator triggered by: $TRIGGER | $WORKFLOW_NAME | $CONCLUSION"

      # Download the completing agent's output artifact (only on workflow_run events)
      - name: Download agent output artifact
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != ''
        uses: actions/download-artifact@v4
        continue-on-error: true # Agent may not have produced an artifact
        with:
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: "*_output.json"
          path: agent_outputs/

      # Unified Orchestration Decision (TypeScript)
      - name: Swarm Orchestration Decision
        id: decide
        run: npx tsx scripts/ci_manager.ts ORCHESTRATE
        env:
          TRIGGER: ${{ steps.event.outputs.trigger }}
          FORCE_ACTION: ${{ inputs.force_action }}
          CONCLUSION: ${{ steps.event.outputs.conclusion }}
          WORKFLOW_NAME: ${{ steps.event.outputs.workflow_name }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      # Dispatch the right agent based on decision
      - name: Dispatch → Autonomous Swarm
        if: github.event_name != 'workflow_run' && steps.decide.outputs.next_action == 'autonomous_swarm'
        run: |
          gh workflow run "Autonomous Swarm Cycle" --ref main
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Dispatch → Quantum Evolution
        if: github.event_name != 'workflow_run' && steps.decide.outputs.next_action == 'quantum_evolution'
        run: |
          gh workflow run "Quantum Self-Evolution" \
            --ref main \
            --field green_light=true \
            --field reason="${{ steps.decide.outputs.reason }}"
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Dispatch → Curiosity Scan
        if: github.event_name != 'workflow_run' && steps.decide.outputs.next_action == 'curiosity_scan'
        run: |
          gh workflow run "Curiosity Engine Scan" --ref main
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Dispatch → Frontend QA Swarm
        if: github.event_name != 'workflow_run' && steps.decide.outputs.next_action == 'frontend_qa_swarm'
        run: |
          gh workflow run "Frontend QA Swarm" \
            --ref main \
            --field context='{"reason":"${{ steps.decide.outputs.reason }}"}'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      # Dashboard update is automated via workflow_run triggers
