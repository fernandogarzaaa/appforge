name: Performance Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run performance tests weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'

jobs:
  lighthouse-performance:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
        env:
          CI: true

      - name: Verify build output
        run: |
          if [ ! -d dist ]; then
            echo "Build output directory 'dist' not found. Build verification failed."
            exit 1
          fi

      - name: Start static file server
        run: |
          npx serve dist -l 8080 &
          echo $! > /tmp/server.pid
          
          # Wait for server to be ready with health check
          echo "Waiting for server to start on port 8080..."
          RETRY_COUNT=0
          MAX_RETRIES=30
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f http://localhost:8080 > /dev/null 2>&1; then
              echo "✓ Server is ready and responding!"
              break
            fi
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Server not ready yet, waiting..."
            sleep 1
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          
          if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
            echo "✗ Server failed to start after 30 seconds"
            kill $(cat /tmp/server.pid) 2>/dev/null || true
            exit 1
          fi

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        timeout-minutes: 15
        with:
          urls: |
            http://localhost:8080
          uploadArtifacts: true
          temporaryPublicStorage: true
      
      - name: Stop static file server
        if: always()
        run: kill $(cat /tmp/server.pid) 2>/dev/null || true

  load-testing:
    name: API Load Testing
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Start backend server
        working-directory: ./backend
        run: |
          npm start &
          sleep 10
        env:
          NODE_ENV: production
          MONGODB_URI: mongodb://localhost:27017/appforge-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-performance-testing
          ENCRYPTION_KEY: 12345678901234567890123456789012
      
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run load tests
        working-directory: ./backend/load-tests
        run: k6 run --out json=results.json --timeout 5m load-test.js
        timeout-minutes: 10
        continue-on-error: true
      
      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: backend/load-tests/results.json
          retention-days: 30

  bundle-size-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build and analyze
        run: npm run build
        env:
          CI: true
      
      - name: Analyze bundle size
        uses: andresz1/size-limit-action@v1
        if: github.event_name == 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install
