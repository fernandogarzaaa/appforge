[package]
name = "quantum-core"
version = "0.1.0"
edition = "2021"
authors = ["AppForge Contributors"]
description = "Quantum interference validator for AI consensus (WASM core)"
repository = "https://github.com/fernandogarzaaa/appforge"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "qcore"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
num-complex = "0.4"
ndarray = "0.15"
ndarray-rand = "0.14"
getrandom = { version = "0.2", features = ["js"] }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = "0.32"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = true
