[package]
name = "quantum-core"
version = "0.1.0"
edition = "2021"
authors = ["AppForge Contributors"]
description = "Quantum interference validator for AI consensus (WASM core)"
repository = "https://github.com/fernandogarzaaa/appforge"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
num-complex = "0.4"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = true
